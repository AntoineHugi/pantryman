name: Android APK

# Builds the signed APK. Run it by hand (Actions → Android APK → Run workflow), or push a tag
# like v1.2.0 to also attach the APK to a GitHub release. Installed apps offer the latest release
# as an update (src/appUpdate.ts), so only tagged builds reach phones that way.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Goes up with every run, so each APK installs over the previous one
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      # Builds the web app against the production API (.env.android) and copies it into android/
      - run: npm run build:android

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing; an unsigned APK can't be installed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          # The version code at the end is what the app compares to its own (src/appUpdate.ts)
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pantryman-$ANDROID_VERSION_NAME-$ANDROID_VERSION_CODE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pantryman-${{ env.ANDROID_VERSION_NAME }}
          path: ${{ runner.temp }}/pantryman-*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pantryman-*.apk --title "$GITHUB_REF_NAME" --generate-notes
